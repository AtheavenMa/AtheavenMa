name: Refresh profile metrics

on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate activity cards from GitHub public data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_metrics.py
      - name: Commit only if metrics changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-activity-light.svg assets/github-activity-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public GitHub profile metrics'
            git push
          fi
